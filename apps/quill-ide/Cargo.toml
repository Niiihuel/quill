[package]
name = "quill-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "quill-ide: a native code reader and editor in quill's look, drawn with limn."

[dependencies]
# Tree-sitter's highlighting, which tells types, properties and functions apart.
limn = { workspace = true, features = ["syntax"] }
limn-egui.workspace = true
limn-editor.workspace = true
eframe.workspace = true
quill-components = { path = "../../crates/quill-components" }
# Lists a folder as git sees it, .gitignore and all, as ripgrep does.
ignore = "0.4"
serde.workspace = true
serde_json.workspace = true
# The platform's own folder dialog, through the desktop portal (no GTK linked in), as quill's.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# A line diff of a file against its last commit, for the gutter's marks.
similar = "2"
