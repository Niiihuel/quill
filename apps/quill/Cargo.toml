[package]
name = "quill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "quill: a native desktop app for coding-agent CLIs, drawn with limn."

[dependencies]
limn.workspace = true
limn-egui.workspace = true
eframe.workspace = true
quill-ui = { path = "../../crates/quill-ui" }
quill-components = { path = "../../crates/quill-components" }
quill-model = { path = "../../crates/quill-model" }
quill-engine = { path = "../../crates/quill-engine" }
# The platform's own folder dialog, through the desktop portal (no GTK linked in).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
quill-pty = { path = "../../crates/quill-pty" }
# The browser's frames, handed to egui as its own pixels without a copy (already in the tree).
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
# The window's Wayland connection and surface, which the page is presented beneath (direct.rs).
raw-window-handle = "0.6"
# A subsurface of quill's own on that connection, and dmabufs handed to the compositor (already
# in the tree through winit).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# The buffers the page is presented in, allocated where the compositor can read them.
gbm = { version = "0.18", default-features = false }
# `quill --open-url`, the agents' $BROWSER, speaks a line of JSON to the window's bridge.
serde_json.workspace = true
# Files open in quill-ide's window of their folder, and code from it comes as a message.
quill-link = { path = "../../crates/quill-link" }
# An installed editor's icon becomes a limn picture: its digest and its bytes in base64 (both
# already in the tree).
sha2 = "0.10"
base64 = "0.22"
