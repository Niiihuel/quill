[package]
name = "quill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "quill: a native desktop app for coding-agent CLIs, drawn with limn."

[dependencies]
limn.workspace = true
limn-egui.workspace = true
eframe.workspace = true
quill-ui = { path = "../../crates/quill-ui" }
quill-model = { path = "../../crates/quill-model" }
quill-engine = { path = "../../crates/quill-engine" }
# The platform's own folder dialog, through the desktop portal (no GTK linked in).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
quill-pty = { path = "../../crates/quill-pty" }
# `quill --open-url`, the agents' $BROWSER, speaks a line of JSON to the window's bridge.
serde_json.workspace = true
