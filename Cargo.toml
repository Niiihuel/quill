[workspace]
resolver = "2"
# A crate under crates/ is created when its plan task needs it (docs/plan.md).
members = ["apps/*", "crates/*", "tools/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# limn by path, as surco does: a limn PR is tried by pointing these at its worktree.
limn = { path = "../lienzo/crates/limn", default-features = false }
limn-egui = { path = "../lienzo/crates/limn-egui", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

# An unoptimized renderer drops frames; quill's own crates stay unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
debug = false
