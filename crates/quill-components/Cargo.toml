[package]
name = "quill-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "quill's look, shared by its apps: tokens, icons and the system's fonts, over limn."
publish = false

[dependencies]
# Fonts::bundled, under the system faces fontconfig finds.
limn = { workspace = true, features = ["bundled-fonts"] }
quill-model = { path = "../quill-model" }
# The tree's entries and file operations, which the host runs on the disk.
quill-files = { path = "../quill-files" }
# VS Code icon themes, which the file icons can be taken from, are JSON.
serde_json.workspace = true
