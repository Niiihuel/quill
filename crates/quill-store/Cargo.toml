[package]
name = "quill-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "quill's durable record: every event a session showed, replayed at start."
publish = false

[dependencies]
quill-model = { path = "../quill-model" }
serde_json.workspace = true
# SQLite compiled in, so quill needs no system library for its record.
rusqlite = { version = "0.37", features = ["bundled"] }
