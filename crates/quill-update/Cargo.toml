[package]
name = "quill-update"
description = "quill's own updates: a signed manifest per release, its download and its installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The loopback file server of the tests and of the local test feed (tools/quill-release).
serve = []

[dependencies]
# The manifest is a small JSON document, and the GitHub API's answer too.
serde = { workspace = true }
serde_json.workspace = true
# Versions compared as SemVer says (pre-releases included); already in the lock.
semver = { version = "1.0.28", features = ["serde"] }
# The manifest's Ed25519 signature, checked strictly (weak keys refused); the one signature
# format quill uses.
ed25519-dalek = { version = "2.2", default-features = false }
# The artifact's digest, and the signature and key as text.
sha2 = "0.10"
base64 = "0.22"
# HTTPS requests, on the update thread: the engine's own client (quill-engine's logos use it too).
ureq = "3"
# The Linux artifact is the program gzip-compressed, decoded with the decoder already in the tree.
flate2 = "1.1"

[dev-dependencies]
# A throwaway signing key per test, and temporary installations.
getrandom = "0.3"
tempfile = "3"
