[package]
name = "quill-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "quill's engine: one actor per session owning its agent's process."
publish = false

[dependencies]
quill-model = { path = "../quill-model" }
quill-agent = { path = "../quill-agent" }
quill-agent-claude = { path = "../quill-agent-claude" }
quill-agent-codex = { path = "../quill-agent-codex" }
quill-store = { path = "../quill-store" }
quill-git = { path = "../quill-git" }
# The built-in browser, a Chromium driven over DevTools (docs/browser.md).
quill-browser = { path = "../quill-browser" }
# The Files pane's listing and file operations, run on the disk.
quill-files = { path = "../quill-files" }
serde_json.workspace = true
# Processes, pipes, one actor per session, and the $BROWSER bridge's unix socket.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "net"] }
# Sizing the images a message attaches: decode, resize, and JPEG (PNG, JPEG, GIF, WebP only);
# ICO too, for a site's favicon.ico (a logo, quill-engine's logos.rs).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
# quill's own updates: the signed manifest, the download and the installation (update.rs).
quill-update = { path = "../quill-update" }
# Fetching a connector's or plugin's logo over https, with a ten-second limit (logos.rs).
ureq = "3"
# Rasterizing an SVG logo to 64 px; no text or fonts, which a logo does not need.
resvg = { version = "0.48.1", default-features = false }
# Request ids, as the agent receives them for each prompt.
uuid = { version = "1", features = ["v4"] }
# Stopping a dev server's whole process group (kill with a negative pid).
libc = "0.2"
