[package]
name = "quill-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A folder's files as quill's trees show and change them: listing and the operations, on the disk."
publish = false

[dependencies]
# Lists a folder as git sees it, .gitignore and all, as ripgrep does.
ignore = "0.4"
# The desktop's trash, where the tree moves what it deletes.
trash = "5"
# renameat2 with RENAME_NOREPLACE: a rename in the tree never replaces a file.
libc = "0.2"
